<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulse Status</title>
  <meta name="description" content="Current availability status for Pulse." />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #1a1a1a;
      --surface-soft: #2a2a2a;
      --brand: #00ff88;
      --text: #f6f7f8;
      --muted: #9aa0a6;
      --border: rgba(255, 255, 255, 0.12);
      --ok: #00ff88;
      --warn: #ffcc66;
      --bad: #ff5b6e;
      --info: #7ab7ff;
      --unknown: #aab0b8;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    button {
      font: inherit;
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 32px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 26px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .logo {
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
    }

    .brand-title {
      margin: 0;
      font-size: 1.18rem;
      line-height: 1.1;
      font-weight: 750;
    }

    .brand-subtitle {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 0.84rem;
    }

    .refresh-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .source-pill,
    .refresh-button {
      min-height: 36px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      white-space: nowrap;
    }

    .refresh-button {
      color: var(--text);
      cursor: pointer;
    }

    .refresh-button:hover,
    .refresh-button:focus-visible {
      border-color: rgba(0, 255, 136, 0.5);
      outline: none;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 18px;
      align-items: stretch;
      margin-bottom: 18px;
    }

    .status-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      box-shadow: var(--shadow);
      min-height: 216px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 22px;
    }

    .status-main {
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .status-mark {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      background: var(--surface-soft);
      font-weight: 800;
      color: var(--ok);
      flex: 0 0 auto;
    }

    .status-mark.degraded {
      color: var(--warn);
    }

    .status-mark.outage {
      color: var(--bad);
    }

    .status-mark.maintenance {
      color: var(--info);
    }

    .status-mark.unknown {
      color: var(--unknown);
    }

    .status-title {
      margin: 0;
      font-size: clamp(2rem, 5vw, 4.2rem);
      line-height: 0.95;
      font-weight: 800;
      letter-spacing: 0;
    }

    .status-copy {
      margin: 10px 0 0;
      max-width: 620px;
      color: var(--muted);
      font-size: 1rem;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .meta-item {
      border: 1px solid var(--border);
      background: var(--surface-soft);
      border-radius: 8px;
      padding: 12px;
      min-width: 0;
    }

    .meta-label {
      color: var(--muted);
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .meta-value {
      margin-top: 3px;
      font-size: 0.92rem;
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    .snapshot {
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 8px;
      padding: 18px;
      min-height: 216px;
      display: grid;
      gap: 12px;
    }

    .snapshot-row {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    .snapshot-row:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .snapshot-label {
      color: var(--muted);
      font-size: 0.86rem;
    }

    .snapshot-value {
      font-weight: 750;
      text-align: right;
    }

    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0 14px;
      scrollbar-width: thin;
    }

    .tab {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--muted);
      padding: 10px 14px;
      cursor: pointer;
      white-space: nowrap;
    }

    .tab[aria-selected="true"] {
      background: var(--brand);
      border-color: var(--brand);
      color: #00140a;
      font-weight: 800;
    }

    .tab:focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 2px;
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      padding: 14px;
      min-height: 132px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }

    .card-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
    }

    .name {
      font-weight: 720;
      overflow-wrap: anywhere;
    }

    .badge {
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      color: #00140a;
      background: var(--ok);
      white-space: nowrap;
    }

    .badge.degraded {
      background: var(--warn);
      color: #1f1200;
    }

    .badge.outage {
      background: var(--bad);
      color: #210006;
    }

    .badge.maintenance {
      background: var(--info);
      color: #00101f;
    }

    .badge.unknown {
      background: var(--surface-soft);
      color: var(--unknown);
      border: 1px solid var(--border);
    }

    .card-meta {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 0.84rem;
    }

    .overview-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 12px;
    }

    .timeline {
      border-left: 1px solid var(--border);
      padding-left: 16px;
      display: grid;
      gap: 12px;
    }

    .incident {
      position: relative;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      padding: 14px;
    }

    .incident::before {
      content: "";
      position: absolute;
      left: -21px;
      top: 18px;
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--brand);
    }

    .incident-head {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .incident-title {
      font-weight: 760;
    }

    .incident-time,
    .empty {
      color: var(--muted);
      font-size: 0.86rem;
    }

    .updates {
      display: grid;
      gap: 10px;
    }

    .update-label {
      font-size: 0.76rem;
      color: var(--brand);
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 0.07em;
    }

    .update-text {
      color: var(--muted);
      margin-top: 2px;
    }

    .empty {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      padding: 22px;
      text-align: center;
    }

    .footer {
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      border-top: 1px solid var(--border);
      padding-top: 18px;
      margin-top: 28px;
      font-size: 0.84rem;
    }

    .footer a {
      color: var(--brand);
      text-decoration: none;
    }

    @media (max-width: 980px) {
      .hero,
      .overview-grid {
        grid-template-columns: 1fr;
      }

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .shell {
        width: min(100% - 24px, 1180px);
        padding-top: 18px;
      }

      .topbar,
      .status-main,
      .snapshot-row {
        align-items: flex-start;
      }

      .topbar {
        flex-direction: column;
      }

      .refresh-row {
        width: 100%;
        justify-content: flex-start;
      }

      .status-panel {
        padding: 18px;
      }

      .status-main {
        flex-direction: column;
      }

      .meta-grid,
      .grid {
        grid-template-columns: 1fr;
      }

      .snapshot-row {
        flex-direction: column;
      }

      .snapshot-value {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <svg class="logo" viewBox="0 0 301.71 301.71" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path fill="#00ff88" d="M150.85,0C67.53,0,0,67.55,0,150.86c0,83.31,67.55,150.85,150.86,150.85,83.31,0,150.85-67.55,150.85-150.86C301.7,67.53,234.16,0,150.85,0ZM207.88,229.96c-29.33,0-44.02-38.6-57.03-79.11H25.22c22.87,0,36.79-79.11,68.6-79.11,29.33,0,44.02,38.6,57.03,79.11h125.63c-22.87,0-36.79,79.11-68.6,79.11Z"/>
        </svg>
        <div>
          <h1 class="brand-title">Pulse Status</h1>
          <p class="brand-subtitle">Current availability across Pulse workspaces</p>
        </div>
      </div>
      <div class="refresh-row">
        <span class="source-pill" id="source-pill">Source: loading</span>
        <button class="refresh-button" id="refresh-button" type="button">Refresh</button>
      </div>
    </header>

    <section class="hero" aria-label="Current status">
      <div class="status-panel">
        <div class="status-main">
          <div class="status-mark operational" id="status-mark">OK</div>
          <div>
            <h2 class="status-title" id="status-title">Checking Pulse</h2>
            <p class="status-copy" id="status-copy">Loading the latest monitoring snapshot.</p>
          </div>
        </div>
        <div class="meta-grid">
          <div class="meta-item">
            <div class="meta-label">Generated</div>
            <div class="meta-value" id="generated-at">--</div>
          </div>
          <div class="meta-item">
            <div class="meta-label">Freshness</div>
            <div class="meta-value" id="freshness">--</div>
          </div>
          <div class="meta-item">
            <div class="meta-label">Watchpoints</div>
            <div class="meta-value" id="watchpoint-count">--</div>
          </div>
        </div>
      </div>
      <aside class="snapshot" aria-label="Snapshot">
        <div class="snapshot-row">
          <span class="snapshot-label">Operational</span>
          <span class="snapshot-value" id="count-operational">0</span>
        </div>
        <div class="snapshot-row">
          <span class="snapshot-label">Needs attention</span>
          <span class="snapshot-value" id="count-attention">0</span>
        </div>
        <div class="snapshot-row">
          <span class="snapshot-label">Unknown</span>
          <span class="snapshot-value" id="count-unknown">0</span>
        </div>
        <div class="snapshot-row">
          <span class="snapshot-label">External checks</span>
          <span class="snapshot-value" id="count-external">0</span>
        </div>
      </aside>
    </section>

    <nav class="tabs" aria-label="Status sections">
      <button class="tab" type="button" data-tab="overview" aria-selected="true">Overview</button>
      <button class="tab" type="button" data-tab="watchpoints" aria-selected="false">Watchpoints</button>
      <button class="tab" type="button" data-tab="incidents" aria-selected="false">Incidents</button>
      <button class="tab" type="button" data-tab="external" aria-selected="false">External Checks</button>
    </nav>

    <section class="tab-panel active" id="panel-overview" aria-label="Overview">
      <div class="overview-grid">
        <div class="grid" id="overview-grid"></div>
        <div id="overview-incidents"></div>
      </div>
    </section>

    <section class="tab-panel" id="panel-watchpoints" aria-label="Watchpoints">
      <div class="grid" id="watchpoints-grid"></div>
    </section>

    <section class="tab-panel" id="panel-incidents" aria-label="Incidents">
      <div class="timeline" id="incidents-list"></div>
    </section>

    <section class="tab-panel" id="panel-external" aria-label="External checks">
      <div class="grid" id="external-grid"></div>
    </section>

    <footer class="footer">
      <span>Pulse Labs (Pty) Ltd</span>
      <a href="https://usepulseapp.com">usepulseapp.com</a>
    </footer>
  </main>

  <script>
    const CONFIG = {
      publicStatusEndpoint: 'https://usepulseapp.com/api/index.php?route=status/public',
      sameOriginFallback: 'status.json',
      healthEndpoint: 'https://usepulseapp.com/api/index.php?route=health',
      timeoutMs: 8000,
      refreshMs: 60000,
      slowMs: 3000,
    };

    const STATUS_META = {
      operational: { title: 'All Systems Operational', copy: 'Pulse is available and running normally.', mark: 'OK', badge: 'Operational' },
      degraded: { title: 'Degraded Performance', copy: 'Some Pulse areas may be slower or partially unavailable.', mark: '!', badge: 'Degraded' },
      outage: { title: 'Service Outage', copy: 'One or more Pulse areas are currently unavailable.', mark: 'X', badge: 'Outage' },
      maintenance: { title: 'Scheduled Maintenance', copy: 'Maintenance is in progress on one or more Pulse areas.', mark: 'MT', badge: 'Maintenance' },
      unknown: { title: 'Status Unknown', copy: 'The latest monitoring snapshot is not available yet.', mark: '--', badge: 'Unknown' },
    };

    const FALLBACK_STATUS = {
      version: 1,
      generated_at: '2026-03-19T13:00:00+02:00',
      overall: 'operational',
      source: 'static-fallback',
      stale_after_seconds: 3600,
      watchpoints: [
        { key: 'core_web', label: 'Core Web', status: 'operational', group: 'product', message: 'Operational' },
        { key: 'api', label: 'API', status: 'operational', group: 'product', message: 'Operational' },
        { key: 'auth', label: 'Auth', status: 'unknown', group: 'product', message: 'Not currently monitored' },
        { key: 'payments', label: 'Payments', status: 'unknown', group: 'product', message: 'Not currently monitored' },
        { key: 'chat', label: 'Chat', status: 'unknown', group: 'product', message: 'Not currently monitored' },
        { key: 'file_uploads', label: 'File Uploads', status: 'unknown', group: 'product', message: 'Not currently monitored' },
        { key: 'inventory', label: 'Inventory', status: 'unknown', group: 'product', message: 'Not currently monitored' },
        { key: 'tickets', label: 'Tickets', status: 'unknown', group: 'product', message: 'Not currently monitored' },
        { key: 'forms', label: 'Forms', status: 'unknown', group: 'product', message: 'Not currently monitored' },
        { key: 'projects', label: 'Projects', status: 'unknown', group: 'product', message: 'Not currently monitored' },
        { key: 'leads', label: 'Leads', status: 'unknown', group: 'product', message: 'Not currently monitored' },
        { key: 'calendar', label: 'Calendar', status: 'unknown', group: 'product', message: 'Not currently monitored' },
        { key: 'reports', label: 'Reports', status: 'unknown', group: 'product', message: 'Not currently monitored' },
        { key: 'notifications', label: 'Notifications', status: 'unknown', group: 'product', message: 'Not currently monitored' },
      ],
      incidents: [
        {
          title: 'Production outage - upstream ingress failure',
          status: 'resolved',
          started_at: '2026-03-19T11:24:00+02:00',
          resolved_at: '2026-03-19T13:00:00+02:00',
          updates: [
            { time: '2026-03-19T13:00:00+02:00', label: 'Resolved', text: 'Upstream ingress service was restored and Pulse returned to normal operation.' },
            { time: '2026-03-19T11:24:00+02:00', label: 'Detected', text: 'Users were unable to access the production site. No Pulse data was lost.' },
          ],
        },
      ],
      external_checks: [],
    };

    let currentStatus = normalizeStatus(FALLBACK_STATUS, 'static-fallback');

    document.getElementById('refresh-button').addEventListener('click', () => refreshStatus(true));
    document.querySelectorAll('.tab').forEach((button) => {
      button.addEventListener('click', () => activateTab(button.dataset.tab));
    });

    refreshStatus(false);
    window.setInterval(() => refreshStatus(false), CONFIG.refreshMs);

    function activateTab(tab) {
      document.querySelectorAll('.tab').forEach((button) => {
        button.setAttribute('aria-selected', String(button.dataset.tab === tab));
      });
      document.querySelectorAll('.tab-panel').forEach((panel) => {
        panel.classList.toggle('active', panel.id === `panel-${tab}`);
      });
    }

    async function refreshStatus(manual) {
      const button = document.getElementById('refresh-button');
      if (manual) {
        button.disabled = true;
        button.textContent = 'Refreshing';
      }
      try {
        currentStatus = await loadStatus();
      } finally {
        render(currentStatus);
        button.disabled = false;
        button.textContent = 'Refresh';
      }
    }

    async function loadStatus() {
      let staleCandidate = null;
      const primary = await fetchJson(CONFIG.publicStatusEndpoint, 'vps-public-status');
      if (primary) {
        const normalized = normalizeStatus(primary.data, primary.source);
        if (!isStale(normalized)) return normalized;
        staleCandidate = normalized;
      }

      const fallback = await fetchJson(`${CONFIG.sameOriginFallback}?t=${Date.now()}`, 'pi-status-json');
      if (fallback) {
        const normalized = normalizeStatus(fallback.data, fallback.source);
        if (!isStale(normalized)) return normalized;
        staleCandidate = staleCandidate || normalized;
      }

      const live = await liveHealthFallback();
      const liveStatus = normalizeStatus(live, 'browser-health-check');
      return isStale(liveStatus) && staleCandidate ? staleCandidate : liveStatus;
    }

    async function fetchJson(url, source) {
      try {
        const controller = new AbortController();
        const timeout = window.setTimeout(() => controller.abort(), CONFIG.timeoutMs);
        const response = await fetch(url, { cache: 'no-store', mode: 'cors', signal: controller.signal });
        window.clearTimeout(timeout);
        if (!response.ok) return null;
        const data = await response.json();
        return { data, source };
      } catch (error) {
        return null;
      }
    }

    async function liveHealthFallback() {
      const started = Date.now();
      const generatedAt = new Date().toISOString();
      try {
        const controller = new AbortController();
        const timeout = window.setTimeout(() => controller.abort(), CONFIG.timeoutMs);
        const response = await fetch(CONFIG.healthEndpoint, { cache: 'no-store', mode: 'cors', signal: controller.signal });
        window.clearTimeout(timeout);
        const latency = Date.now() - started;
        const status = response.ok ? (latency > CONFIG.slowMs ? 'degraded' : 'operational') : 'degraded';
        return {
          version: 1,
          generated_at: generatedAt,
          overall: status,
          source: 'browser-health-check',
          stale_after_seconds: 120,
          watchpoints: [{ key: 'api', label: 'API', status, group: 'product', latency_ms: latency, checked_at: generatedAt, message: statusLabel(status) }],
          incidents: FALLBACK_STATUS.incidents,
          external_checks: [{ key: 'browser_api', label: 'Browser API Check', status, latency_ms: latency, checked_at: generatedAt }],
        };
      } catch (error) {
        const latency = Date.now() - started;
        return {
          version: 1,
          generated_at: generatedAt,
          overall: 'unknown',
          source: 'browser-health-check',
          stale_after_seconds: 120,
          watchpoints: [{ key: 'api', label: 'API', status: 'unknown', group: 'product', latency_ms: latency, checked_at: generatedAt, message: 'Not reachable from this browser' }],
          incidents: FALLBACK_STATUS.incidents,
          external_checks: [{ key: 'browser_api', label: 'Browser API Check', status: 'unknown', latency_ms: latency, checked_at: generatedAt }],
        };
      }
    }

    function normalizeStatus(input, source) {
      const data = input && typeof input === 'object' ? input : FALLBACK_STATUS;
      return {
        version: Number(data.version || 1),
        generated_at: validTime(data.generated_at) || new Date().toISOString(),
        overall: normalizeState(data.overall),
        source: String(data.source || source || 'unknown'),
        stale_after_seconds: Number(data.stale_after_seconds || 300),
        watchpoints: normalizeWatchpoints(data.watchpoints),
        incidents: normalizeIncidents(data.incidents),
        external_checks: normalizeExternal(data.external_checks),
        loaded_from: source || String(data.source || 'unknown'),
      };
    }

    function normalizeWatchpoints(items) {
      const list = Array.isArray(items) ? items : [];
      return list.map((item) => ({
        key: String(item.key || item.name || item.label || 'watchpoint').slice(0, 80),
        label: String(item.label || item.name || 'Pulse').slice(0, 80),
        status: normalizeState(item.status),
        group: String(item.group || 'product').slice(0, 40),
        checked_at: validTime(item.checked_at || item.updated_at) || null,
        latency_ms: Number.isFinite(Number(item.latency_ms)) ? Number(item.latency_ms) : null,
        message: String(item.message || statusLabel(normalizeState(item.status))).slice(0, 160),
      }));
    }

    function normalizeExternal(items) {
      const list = Array.isArray(items) ? items : [];
      return list.map((item) => ({
        key: String(item.key || item.name || item.label || 'external').slice(0, 80),
        label: String(item.label || item.name || 'External Check').slice(0, 80),
        status: normalizeState(item.status),
        checked_at: validTime(item.checked_at || item.updated_at) || null,
        latency_ms: Number.isFinite(Number(item.latency_ms)) ? Number(item.latency_ms) : null,
        message: String(item.message || statusLabel(normalizeState(item.status))).slice(0, 160),
      }));
    }

    function normalizeIncidents(items) {
      const list = Array.isArray(items) ? items : [];
      return list.map((item) => ({
        title: String(item.title || 'Incident update').slice(0, 120),
        status: String(item.status || 'unknown').slice(0, 40),
        started_at: validTime(item.started_at) || null,
        resolved_at: validTime(item.resolved_at) || null,
        updated_at: validTime(item.updated_at) || null,
        updates: Array.isArray(item.updates) ? item.updates.map((update) => ({
          time: validTime(update.time) || null,
          label: String(update.label || 'Update').slice(0, 60),
          text: String(update.text || '').slice(0, 500),
        })) : [],
      }));
    }

    function render(data) {
      const meta = STATUS_META[data.overall] || STATUS_META.unknown;
      const counts = countStatuses(data.watchpoints);
      const stale = isStale(data);

      const mark = document.getElementById('status-mark');
      mark.className = `status-mark ${data.overall}`;
      mark.textContent = meta.mark;
      document.getElementById('status-title').textContent = stale ? 'Status Snapshot Stale' : meta.title;
      document.getElementById('status-copy').textContent = stale ? 'The latest monitoring data is older than expected.' : meta.copy;
      document.getElementById('generated-at').textContent = formatTime(data.generated_at);
      document.getElementById('freshness').textContent = stale ? 'Stale' : 'Fresh';
      document.getElementById('watchpoint-count').textContent = String(data.watchpoints.length);
      document.getElementById('source-pill').textContent = `Source: ${data.loaded_from || data.source}`;
      document.getElementById('count-operational').textContent = String(counts.operational);
      document.getElementById('count-attention').textContent = String(counts.degraded + counts.outage + counts.maintenance);
      document.getElementById('count-unknown').textContent = String(counts.unknown);
      document.getElementById('count-external').textContent = String(data.external_checks.length);

      document.getElementById('overview-grid').replaceChildren(...data.watchpoints.slice(0, 6).map(watchpointCard));
      renderOverviewIncidents(data.incidents);
      document.getElementById('watchpoints-grid').replaceChildren(...data.watchpoints.map(watchpointCard));
      renderIncidents(data.incidents);
      renderExternal(data.external_checks);
    }

    function renderOverviewIncidents(incidents) {
      const target = document.getElementById('overview-incidents');
      const recent = incidents[0];
      target.replaceChildren(recent ? incidentCard(recent) : emptyNode('No recent incidents.'));
    }

    function renderIncidents(incidents) {
      const target = document.getElementById('incidents-list');
      if (!incidents.length) {
        target.replaceChildren(emptyNode('No recent incidents.'));
        return;
      }
      target.replaceChildren(...incidents.map(incidentCard));
    }

    function renderExternal(checks) {
      const target = document.getElementById('external-grid');
      if (!checks.length) {
        target.replaceChildren(emptyNode('External checker data is not available yet.'));
        return;
      }
      target.replaceChildren(...checks.map(watchpointCard));
    }

    function watchpointCard(item) {
      const card = element('article', 'card');
      const head = element('div', 'card-title');
      head.append(element('div', 'name', item.label), badge(item.status));
      const meta = element('div', 'card-meta');
      meta.append(
        element('span', '', item.message || statusLabel(item.status)),
        element('span', '', item.latency_ms !== null ? `${Math.round(item.latency_ms)} ms` : 'Latency --'),
        element('span', '', item.checked_at ? formatTime(item.checked_at) : 'Checked --')
      );
      card.append(head, meta);
      return card;
    }

    function incidentCard(incident) {
      const card = element('article', 'incident');
      const head = element('div', 'incident-head');
      const titleWrap = element('div');
      titleWrap.append(element('div', 'incident-title', incident.title), element('div', 'incident-time', incidentTime(incident)));
      head.append(titleWrap, badge(incident.status));
      const updates = element('div', 'updates');
      incident.updates.forEach((update) => {
        const row = element('div');
        row.append(
          element('div', 'update-label', update.label),
          element('div', 'incident-time', update.time ? formatTime(update.time) : ''),
          element('div', 'update-text', update.text)
        );
        updates.append(row);
      });
      card.append(head, updates);
      return card;
    }

    function emptyNode(text) {
      return element('div', 'empty', text);
    }

    function badge(status) {
      return element('span', `badge ${normalizeState(status)}`, statusLabel(status));
    }

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function countStatuses(items) {
      return items.reduce((acc, item) => {
        acc[item.status] = (acc[item.status] || 0) + 1;
        return acc;
      }, { operational: 0, degraded: 0, outage: 0, maintenance: 0, unknown: 0 });
    }

    function normalizeState(status) {
      const value = String(status || '').toLowerCase();
      return ['operational', 'degraded', 'outage', 'maintenance', 'unknown', 'resolved', 'investigating', 'identified', 'monitoring'].includes(value)
        ? value
        : 'unknown';
    }

    function statusLabel(status) {
      const value = normalizeState(status);
      if (value === 'operational') return 'Operational';
      if (value === 'degraded') return 'Degraded';
      if (value === 'outage') return 'Outage';
      if (value === 'maintenance') return 'Maintenance';
      if (value === 'resolved') return 'Resolved';
      if (value === 'investigating') return 'Investigating';
      if (value === 'identified') return 'Identified';
      if (value === 'monitoring') return 'Monitoring';
      return 'Unknown';
    }

    function validTime(value) {
      if (!value) return null;
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? null : date.toISOString();
    }

    function formatTime(value) {
      if (!value) return '--';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '--';
      return date.toLocaleString('en-ZA', {
        year: 'numeric',
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
      });
    }

    function incidentTime(incident) {
      if (incident.resolved_at) return `Resolved ${formatTime(incident.resolved_at)}`;
      if (incident.updated_at) return `Updated ${formatTime(incident.updated_at)}`;
      if (incident.started_at) return `Started ${formatTime(incident.started_at)}`;
      return 'Timeline unavailable';
    }

    function isStale(data) {
      const generated = new Date(data.generated_at).getTime();
      if (!Number.isFinite(generated)) return true;
      const staleAfterMs = Math.max(60, Number(data.stale_after_seconds || 300)) * 1000;
      return Date.now() - generated > staleAfterMs;
    }
  </script>
</body>
</html>
